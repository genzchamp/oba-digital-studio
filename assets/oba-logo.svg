<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OBA Digital Studio logo</title>
  <desc id="desc">A neon green circular mark with a silver and neon green OBA monogram.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9adb2"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#baff00"/><stop offset="1" stop-color="#52b800"/></linearGradient>
  </defs>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#a6ff00" stroke-width="9"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="174" letter-spacing="-18">
    <text x="92" y="317" fill="url(#silver)">O</text>
    <text x="215" y="317" fill="url(#green)">B</text>
    <text x="318" y="317" fill="url(#silver)">A</text>
  </g>
  <g fill="#a6ff00"><rect x="58" y="238" width="24" height="24" rx="2"/><rect x="83" y="207" width="31" height="31" rx="2"/><rect x="83" y="269" width="31" height="31" rx="2"/><rect x="116" y="239" width="31" height="31" rx="2"/></g>
</svg>
